<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matje CO₂</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #070b14;
    --surface: #0d1526;
    --line: #00e5ff;
    --accent: #ff4d6d;
    --text: #e0f7fa;
    --muted: #4a6fa5;
    --glow: rgba(0,229,255,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow: hidden;
  }

  /* animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridScroll 20s linear infinite;
    pointer-events: none;
  }

  @keyframes gridScroll {
    0% { transform: translate(0,0); }
    100% { transform: translate(40px, 40px); }
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(5rem, 15vw, 13rem);
    letter-spacing: 0.04em;
    line-height: 0.9;
    text-align: center;
    background: linear-gradient(135deg, #00e5ff 0%, #ffffff 40%, #ff4d6d 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 40px rgba(0,229,255,0.5));
    animation: titlePulse 4s ease-in-out infinite;
    margin-bottom: 0.2em;
    position: relative;
    z-index: 1;
  }

  @keyframes titlePulse {
    0%, 100% { filter: drop-shadow(0 0 30px rgba(0,229,255,0.4)); }
    50% { filter: drop-shadow(0 0 60px rgba(0,229,255,0.8)); }
  }

  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: clamp(0.6rem, 1.5vw, 0.85rem);
    letter-spacing: 0.4em;
    color: var(--muted);
    text-align: center;
    text-transform: uppercase;
    margin-bottom: 3rem;
    position: relative;
    z-index: 1;
  }

  .chart-container {
    position: relative;
    z-index: 1;
    width: min(900px, 95vw);
    background: var(--surface);
    border: 1px solid rgba(0,229,255,0.2);
    border-radius: 4px;
    padding: 1.5rem 1rem 1rem 1rem;
    box-shadow: 0 0 60px rgba(0,229,255,0.1), inset 0 0 40px rgba(0,0,0,0.5);
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
    padding: 0 0.5rem;
  }

  .ppm-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--line);
    text-shadow: 0 0 20px var(--glow);
    transition: color 0.5s;
  }

  .ppm-display.danger { color: var(--accent); text-shadow: 0 0 20px rgba(255,77,109,0.6); }

  .ppm-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .timer-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    color: var(--muted);
    text-align: right;
  }

  .timer-display span { font-size: 0.6rem; letter-spacing: 0.2em; display: block; color: var(--muted); }

  canvas {
    display: block;
    width: 100%;
  }

  .axis-labels {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 48px 0 48px;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .status-bar {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    margin-top: 1rem;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--line);
    margin-right: 6px;
    animation: blink 1.2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--glow);
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
</style>
</head>
<body>

<div class="title">Matje CO₂</div>
<div class="subtitle">Real-Time Carbon Dioxide Monitor — PPM Tracker</div>

<div class="chart-container">
  <div class="chart-header">
    <div>
      <div class="ppm-display" id="ppmVal">400</div>
      <div class="ppm-label">PPM CURRENT</div>
    </div>
    <div style="text-align:right">
      <div class="timer-display" id="timerVal">0<span>SECONDS ELAPSED</span></div>
    </div>
  </div>
  <canvas id="graph" height="320"></canvas>
  <div class="axis-labels" id="xLabels"></div>
  <div class="status-bar">
    <span><span class="dot"></span>LIVE FEED</span>
    <span>INTERVAL: 1s</span>
    <span>RANGE: 0–1500 PPM</span>
    <span>DURATION: 0–600s</span>
  </div>
</div>

<script>
const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
const ppmEl = document.getElementById('ppmVal');
const timerEl = document.getElementById('timerVal');
const xLabelsEl = document.getElementById('xLabels');

const MAX_TIME = 600;
const MAX_PPM = 1500;
const TICK = 1;

let data = [];
let elapsed = 0;
let currentPPM = 400;
let velocity = 0;
let phase = 'normal'; // 'normal' | 'spike' | 'drop' | 'recovery'
let phaseTimer = 0;

// Generate x-axis labels
function buildXLabels() {
  const labels = [];
  for (let i = 0; i <= 6; i++) labels.push(`${i * 100}s`);
  xLabelsEl.innerHTML = labels.map(l => `<span>${l}</span>`).join('');
}
buildXLabels();

function resize() {
  const w = canvas.parentElement.clientWidth - 32;
  canvas.width = w;
}
resize();
window.addEventListener('resize', () => { resize(); draw(); });

function nextPPM() {
  phaseTimer++;

  // SPIKE at t=10
  if (elapsed >= 10 && elapsed < 13 && phase === 'normal') {
    phase = 'spike'; phaseTimer = 0;
  }
  if (phase === 'spike') {
    velocity += 60 + Math.random() * 40;
    if (phaseTimer > 3) { phase = 'drop'; phaseTimer = 0; }
  } else if (phase === 'drop') {
    velocity -= 50 + Math.random() * 30;
    if (phaseTimer > 4) { phase = 'recovery'; phaseTimer = 0; }
  } else if (phase === 'recovery') {
    velocity += 20 + Math.random() * 20;
    if (phaseTimer > 5) { phase = 'normal'; phaseTimer = 0; }
  } else {
    // Natural wandering with Perlin-like drift
    const target = 450 + Math.sin(elapsed * 0.03) * 200 + Math.cos(elapsed * 0.07) * 100;
    const diff = target - currentPPM;
    velocity += diff * 0.04 + (Math.random() - 0.5) * 30;
    velocity *= 0.75;
  }

  currentPPM += velocity;
  currentPPM = Math.max(0, Math.min(MAX_PPM, currentPPM));
  return currentPPM;
}

function draw() {
  const W = canvas.width;
  const H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const PAD_L = 48, PAD_R = 12, PAD_T = 10, PAD_B = 10;
  const gW = W - PAD_L - PAD_R;
  const gH = H - PAD_T - PAD_B;

  // Grid & Y-axis
  ctx.strokeStyle = 'rgba(0,229,255,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 15; i++) {
    const y = PAD_T + gH - (i / 15) * gH;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(74,111,165,0.9)';
      ctx.font = '10px "Space Mono"';
      ctx.textAlign = 'right';
      ctx.fillText(`${i * 100}`, PAD_L - 6, y + 4);
    }
  }
  // Vertical grid
  for (let i = 0; i <= 6; i++) {
    const x = PAD_L + (i / 6) * gW;
    ctx.beginPath(); ctx.moveTo(x, PAD_T); ctx.lineTo(x, PAD_T + gH); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = 'rgba(0,229,255,0.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(PAD_L, PAD_T); ctx.lineTo(PAD_L, PAD_T + gH);
  ctx.moveTo(PAD_L, PAD_T + gH); ctx.lineTo(W - PAD_R, PAD_T + gH);
  ctx.stroke();

  if (data.length < 2) return;

  const toX = (t) => PAD_L + (t / MAX_TIME) * gW;
  const toY = (p) => PAD_T + gH - (p / MAX_PPM) * gH;

  // Gradient fill under curve
  const grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T + gH);
  grad.addColorStop(0, 'rgba(0,229,255,0.25)');
  grad.addColorStop(1, 'rgba(0,229,255,0)');

  ctx.beginPath();
  ctx.moveTo(toX(0), toY(data[0]));
  for (let i = 1; i < data.length; i++) {
    const x0 = toX((i-1) * TICK), y0 = toY(data[i-1]);
    const x1 = toX(i * TICK), y1 = toY(data[i]);
    const cpx = (x0 + x1) / 2;
    ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
  }
  ctx.lineTo(toX((data.length-1) * TICK), PAD_T + gH);
  ctx.lineTo(toX(0), PAD_T + gH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // Line
  ctx.beginPath();
  ctx.moveTo(toX(0), toY(data[0]));
  for (let i = 1; i < data.length; i++) {
    const x0 = toX((i-1) * TICK), y0 = toY(data[i-1]);
    const x1 = toX(i * TICK), y1 = toY(data[i]);
    const cpx = (x0 + x1) / 2;
    ctx.bezierCurveTo(cpx, y0, cpx, y1, x1, y1);
  }
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Current dot
  const lastX = toX((data.length - 1) * TICK);
  const lastY = toY(data[data.length - 1]);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 5, 0, Math.PI * 2);
  ctx.fillStyle = phase === 'spike' ? '#ff4d6d' : '#00e5ff';
  ctx.shadowColor = phase === 'spike' ? '#ff4d6d' : '#00e5ff';
  ctx.shadowBlur = 20;
  ctx.fill();
  ctx.shadowBlur = 0;

  // Spike marker line
  if (elapsed >= 10) {
    const sx = toX(10);
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255,77,109,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx, PAD_T); ctx.lineTo(sx, PAD_T + gH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,77,109,0.8)';
    ctx.font = '10px "Space Mono"';
    ctx.textAlign = 'left';
    ctx.fillText('t=10', sx + 4, PAD_T + 14);
  }
}

function tick() {
  if (elapsed >= MAX_TIME) return;
  elapsed++;
  const ppm = Math.round(nextPPM());
  data.push(ppm);

  // Update displays
  ppmEl.textContent = ppm;
  ppmEl.className = 'ppm-display' + (ppm > 1000 ? ' danger' : '');
  timerEl.innerHTML = `${elapsed}<span>SECONDS ELAPSED</span>`;

  draw();
}

// Initial data point
data.push(currentPPM);
draw();

setInterval(tick, 100);
</script>
</body>
</html>
